<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandy | Miranda Rae Photography</title>
<!-- Private Sandy page (added Oct 21 2026): talk to Sandy, preview Miranda's morning check-in, and see every
     text Sandy sent. Same passcode as the Bookings page. Not linked anywhere, not for search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Sandy">
<style>
:root{--ink:#112b39;--teal:#16677a;--cream:#f7f1e8;--line:#e6ddd2;--muted:#5d6b72;--ok:#1f6b3a;--bad:#a3202c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;background:var(--cream)}
button{font-family:inherit}
[hidden]{display:none!important}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{width:min(600px,100%);margin:auto;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.brand b{display:block;font:italic 30px/1.05 Georgia,'Times New Roman',serif;letter-spacing:-.3px}
.brand span{display:block;font-size:12px;font-weight:bold;letter-spacing:4px;margin-top:8px}
.topbar a{color:var(--teal);font-size:14px;font-weight:bold;text-decoration:none;white-space:nowrap}
main{width:min(600px,100%);margin:0 auto;padding:12px 12px 40px}
.card{background:#fff;padding:16px;border-radius:20px;box-shadow:0 8px 30px #26394112;margin-bottom:12px}
h1{font:24px/1.15 Georgia,serif;margin:0 0 4px}
h2{font:bold 13px Arial,sans-serif;letter-spacing:3px;color:var(--teal);margin:0 0 10px;text-transform:uppercase}
input,textarea{font:inherit;font-size:16px;border:1px solid #d5dce0;border-radius:10px;padding:10px;min-height:44px;background:#fbfcfd;width:100%;color:var(--ink)}
textarea{min-height:46px;max-height:160px;resize:none}
.btn{border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:bold;font-size:15px;min-height:44px;padding:0 14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}
/* Who's texting: two big buttons; the chosen one is filled and gets a check mark (not color alone) */
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.who button{border:2px solid var(--line);background:#fff;color:var(--teal);border-radius:14px;min-height:46px;font-size:15px;cursor:pointer}
.who button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:bold}
/* Phone-style conversation */
.thread{display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:56vh;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:85%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.sandy{align-self:flex-start;background:#eef1f3;color:var(--ink);border-bottom-left-radius:6px}
.msg .lb{display:block;font-size:11px;font-weight:bold;letter-spacing:1px;opacity:.75;margin-bottom:2px}
.did{align-self:flex-start;font-size:13px;color:var(--ok);background:#eef8f1;border:1px solid #bfe3cb;border-radius:10px;padding:6px 10px;max-width:90%}
.did.no{color:var(--bad);background:#fbeff0;border-color:#efc7cb}
.compose{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.compose .btn{min-width:72px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
.dots::after{content:'…';animation:d 1s infinite}@keyframes d{50%{opacity:.2}}
/* Setup checklist: ✓ / ✗ symbols carry the meaning, not color */
.chk{list-style:none;margin:0;padding:0}
.chk li{padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.chk li:first-child{border-top:0}
.chk .s{display:inline-block;width:26px;font-weight:bold}
.out{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.out:first-child{border-top:0}
.out .h{font-size:12px;color:var(--muted);margin-bottom:3px}
.out .b{white-space:pre-wrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 24px}
</style>
</head>
<body>
<div class="topbar"><div class="in"><div class="brand"><b>Sandy</b><span>MIRANDA'S ASSISTANT</span></div><a href="/log">Bookings →</a></div></div>
<main>
  <div class="card" id="lock" hidden>
    <h1>Passcode</h1>
    <p class="muted">Same passcode as the Bookings page.</p>
    <input id="pass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Passcode">
    <p class="err" id="perr" hidden>That passcode didn't work.</p>
    <button class="btn" style="width:100%;margin-top:10px" id="go">Open</button>
  </div>

  <div id="app" hidden>
    <div class="card">
      <h2>Text Sandy</h2>
      <div class="who" role="group" aria-label="Who's texting">
        <button type="button" data-as="Miranda">Miranda</button>
        <button type="button" data-as="Randy">Randy</button>
      </div>
      <p class="muted" id="liveNote" style="margin:0 0 8px"></p>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="compose">
        <textarea id="txt" rows="1" placeholder="Text Sandy…"></textarea>
        <button class="btn" id="send" type="button">Send</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="daily" type="button">Preview Miranda's morning text</button>
        <button class="btn ghost" id="reset" type="button">Start over</button>
      </div>
    </div>

    <div class="card">
      <h2>Getting Sandy ready</h2>
      <ul class="chk" id="chk"></ul>
    </div>

    <div class="card">
      <h2>Texts Sandy sent</h2>
      <div id="outbox"><p class="muted">Nothing yet.</p></div>
    </div>
  </div>
</main>
<footer>Miranda Rae Photography · private page</footer>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var API = '/api/sandy', PASS = '', AS = 'Miranda', BUSY = false;
  try { PASS = localStorage.getItem('mrp-log-pass') || ''; AS = localStorage.getItem('mrp-sandy-as') || (localStorage.getItem('mrp-who') === 'Miranda' ? 'Miranda' : 'Randy'); } catch (e) {}
  if (AS !== 'Randy' && AS !== 'Miranda') AS = 'Miranda';
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  var when = function(iso){ try { var d = new Date(iso); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
  var NAMES = { '2563996736': 'Randy', '4482196539': 'Miranda' };

  function call(body){
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-pass': PASS }, body: JSON.stringify(Object.assign({ as: AS }, body)) }).then(function(r){ return r.json(); });
  }
  function bubble(role, text, lbl){ return '<div class="msg ' + role + '">' + (lbl ? '<span class="lb">' + esc(lbl) + '</span>' : '') + esc(text) + '</div>'; }
  // Plain-words note for each change Sandy made in the Bookings app
  var WORDS = { deposit_received: 'Deposit received', paid_in_full: 'Paid in full', add_extra: 'Extra added', deduct: 'Money taken off', move_date: 'Date moved', edit_booking: 'Booking edited', set_photographer: 'Photographer changed', photographer_paid_miranda: 'Photographer paid Miranda', cancel_booking: 'Cancelled', undo: 'Undone', add_booking: 'Booking added', remove_inquiry: 'Inquiry removed', clear_old_inquiries: 'Old inquiries cleared' };
  function didLines(ch){
    return (ch || []).map(function(c){
      var r = c.result || {}, bad = r.error || r.conflict || r.duplicate;
      var who = c.input && c.input.num ? ' · #' + c.input.num : c.input && c.input.name ? ' · ' + c.input.name : '';
      return '<div class="did' + (bad ? ' no' : '') + '">' + (bad ? '✗ Couldn\'t do: ' : '✓ In the Bookings app: ') + esc((WORDS[c.tool] || c.tool) + who) + (bad ? ' (' + esc(r.error || (r.conflict ? 'that time is taken' : 'already there')) + ')' : '') + '</div>';
    }).join('');
  }
  function drawThread(h){
    $('thread').innerHTML = (h || []).length ? h.map(function(m){
      if (m.role === 'user') return m.content === '[Morning check-in]' ? '' : bubble('me', m.content);
      return bubble('sandy', m.content, 'SANDY');
    }).join('') : '<p class="muted">Try: "What do I need to do today?" or "The Smiths paid the deposit by Venmo."</p>';
    $('thread').scrollTop = 1e6;
  }
  function drawStatus(s){
    if (!s) return;
    var r = s.ready || {};
    var items = [
      [r.claude, 'Claude account key added in Netlify (ANTHROPIC_API_KEY)'],
      [r.key, 'Sandy\'s Bookings key added in Netlify (SANDY_KEY)'],
      [r.twilio, 'Twilio keys added in Netlify (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN)'],
      [s.texting, 'Texting turned on (SANDY_TEXTING = on, after Twilio approves)']
    ];
    $('chk').innerHTML = items.map(function(i){ return '<li><span class="s">' + (i[0] ? '✓' : '✗') + '</span>' + esc(i[1]) + '</li>'; }).join('');
    $('liveNote').textContent = s.live
      ? 'Live site: changes Sandy makes here are real changes in the Bookings app.' + (s.texting ? '' : ' Real texting is off for now.')
      : 'Test copy of the site: only test bookings, nothing is texted.';
  }
  function drawOutbox(list){
    list = (list || []).filter(function(o){ return o.kind !== 'changes'; });
    if (!list.length) { $('outbox').innerHTML = '<p class="muted">Nothing yet.</p>'; return; }
    $('outbox').innerHTML = list.map(function(o){
      var head = o.kind === 'incoming' ? '📥 From ' + (NAMES[o.from] || o.from) : o.kind === 'incoming-other' ? '📥 From ' + o.from + ' (not Randy or Miranda)' : o.kind === 'error' ? '⚠️ Problem' : o.kind === 'daily-skip' ? '☀️ Morning check-in skipped' : '📤 To ' + (NAMES[o.to] || o.to) + (o.kind === 'daily' ? ' · morning check-in' : '') + (o.kind === 'forwarded' ? ' · passed along' : '') + (o.error ? ' · NOT SENT: ' + o.error : o.sent ? ' · sent' : ' · not sent (texting off)');
      return '<div class="out"><div class="h">' + esc(when(o.at)) + ' · ' + esc(head) + '</div><div class="b">' + esc(o.body || '') + '</div></div>';
    }).join('');
  }
  function pickWho(){
    Array.prototype.forEach.call(document.querySelectorAll('.who button'), function(b){ var on = b.getAttribute('data-as') === AS; b.classList.toggle('on', on); b.textContent = b.getAttribute('data-as') + (on ? ' ✓' : ''); b.setAttribute('aria-pressed', on); });
    $('txt').placeholder = 'Text Sandy as ' + AS + '…';
  }
  function load(){
    return call({}).then(function(j){
      if (j.error === 'passcode') { $('app').hidden = true; $('lock').hidden = false; if (PASS) $('perr').hidden = false; return; }
      try { localStorage.setItem('mrp-log-pass', PASS); } catch (e) {}
      $('lock').hidden = true; $('app').hidden = false; pickWho();
      drawThread(j.history); drawStatus(j.status); drawOutbox(j.outbox);
    });
  }
  function busy(on){ BUSY = on; $('send').disabled = on; $('daily').disabled = on; $('reset').disabled = on; }
  function send(){
    var t = $('txt').value.trim(); if (!t || BUSY) return;
    busy(true); $('txt').value = '';
    var th = $('thread'); if (th.querySelector('p.muted')) th.innerHTML = '';
    th.insertAdjacentHTML('beforeend', bubble('me', t) + '<div class="msg sandy" id="typing"><span class="lb">SANDY</span><span class="dots">Thinking</span></div>'); th.scrollTop = 1e6;
    call({ action: 'send', text: t }).then(function(j){
      var ty = $('typing'); if (ty) ty.remove();
      if (j.error) { th.insertAdjacentHTML('beforeend', '<div class="did no">✗ ' + esc(j.error) + '</div>'); drawStatus(j.status); return; }
      th.insertAdjacentHTML('beforeend', didLines(j.changes) + bubble('sandy', j.reply, 'SANDY')); th.scrollTop = 1e6; drawStatus(j.status);
    }).catch(function(){ var ty = $('typing'); if (ty) ty.remove(); th.insertAdjacentHTML('beforeend', '<div class="did no">✗ Couldn\'t reach Sandy. Try again.</div>'); })
      .then(function(){ busy(false); });
  }
  $('send').onclick = send;
  $('txt').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('txt').addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 160) + 'px'; });
  $('daily').onclick = function(){
    if (BUSY) return; busy(true);
    var th = $('thread'); if (th.querySelector('p.muted')) th.innerHTML = '';
    th.insertAdjacentHTML('beforeend', '<div class="msg sandy" id="typing"><span class="lb">MORNING TEXT PREVIEW</span><span class="dots">Looking over the app</span></div>'); th.scrollTop = 1e6;
    call({ action: 'daily' }).then(function(j){
      var ty = $('typing'); if (ty) ty.remove();
      th.insertAdjacentHTML('beforeend', j.error ? '<div class="did no">✗ ' + esc(j.error) + '</div>' : bubble('sandy', j.reply, 'MORNING TEXT PREVIEW · to Miranda, not sent')); th.scrollTop = 1e6;
    }).catch(function(){}).then(function(){ busy(false); });
  };
  $('reset').onclick = function(){ if (BUSY) return; call({ action: 'reset' }).then(function(){ drawThread([]); }); };
  Array.prototype.forEach.call(document.querySelectorAll('.who button'), function(b){
    b.onclick = function(){ AS = b.getAttribute('data-as'); try { localStorage.setItem('mrp-sandy-as', AS); } catch (e) {} load(); };
  });
  $('go').onclick = function(){ PASS = $('pass').value.trim(); load(); };
  $('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('go').click(); });
  if (PASS) load(); else $('lock').hidden = false;
})();
</script>
</body>
</html>
