<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit Received | Miranda Rae Photography</title>
<!-- Private page (added Oct 12 2026): Miranda marks a deposit as received once the money shows up
     (Venmo, Cash App, PayPal, cash...). Emails both inboxes and keeps a separate deposits total. Not for search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--ink:#112b39;--teal:#16677a;--cream:#fff9f1;--line:#e6ddd2;--muted:#556770;--ok:#2f8a4e}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;background:var(--cream)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{width:min(560px,92%);margin:auto;display:flex;align-items:center;gap:10px;padding:10px 0}
.topbar img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:2px solid var(--teal)}
.brand b{display:block;font:normal 28px/1 'Great Vibes','Brush Script MT',Georgia,serif}
.brand span{display:block;font-size:9px;letter-spacing:3px;margin-top:3px}
main{width:min(560px,92%);margin:22px auto 40px}
.card{background:#fff;padding:24px 22px;border-radius:16px;box-shadow:0 12px 40px #26394122}
h1{font:30px/1.15 Georgia,serif;text-align:center;margin:0}
.intro{text-align:center;font-size:15px;margin:8px 0 14px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 4px}
label .opt{font-weight:normal;color:var(--muted)}
input,select{font:inherit;border:1px solid #d5dce0;border-radius:8px;padding:12px;width:100%;min-height:48px;background:#fbfcfd;font-size:16px;color:#23394a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.money input{padding-left:26px;font-weight:bold}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:bold;font-size:17px;min-height:54px;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none;line-height:54px}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal);line-height:50px}
.btn[disabled]{opacity:.6}
.err{color:#a33;font-size:14px;text-align:center;margin:10px 0 0}
.check{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;display:grid;place-items:center;margin:6px auto 10px}
.sum{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.8;margin:16px 0 4px}
.sum b{display:inline-block;width:90px;color:var(--muted);font-weight:normal}
[hidden]{display:none!important}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 0 30px}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <img src="/images/destin-199/destin199-miranda.webp" alt="Miranda Rae" width="42" height="42">
  <div class="brand"><b>Miranda Rae Photography</b><span>DEPOSIT RECEIVED · PRIVATE</span></div>
</div></div>
<main>
  <div class="card" id="step1">
    <h1>Deposit Received</h1>
    <p class="intro">Mark it here once the money shows up.</p>
    <label for="name">Client's name</label>
    <input id="name" type="text" autocomplete="off" required>
    <div class="row2">
      <div><label for="num">Booking # <span class="opt">(if you have it)</span></label><input id="num" type="text" inputmode="numeric" placeholder="105" autocomplete="off"></div>
      <div><label for="amount">Amount</label><div class="money"><span>$</span><input id="amount" type="number" inputmode="decimal" min="1" step="any" value="50" required></div></div>
    </div>
    <label for="method">Paid with</label>
    <select id="method"><option>Venmo</option><option>Cash App</option><option>PayPal</option><option>Zelle</option><option>Cash</option><option>Other</option></select>
    <button class="btn" type="button" id="go">✅ Mark Deposit Received</button>
    <p class="err" id="err" hidden>Something went wrong. Please try again.</p>
  </div>
  <div class="card" id="step2" hidden>
    <div class="check">✓</div>
    <h1>Got It!</h1>
    <p class="intro">An email is on its way to Miranda and Randy.</p>
    <div class="sum" id="sum"></div>
    <a class="btn ghost" href="/deposit">Mark Another Deposit</a>
  </div>
</main>
<footer>Miranda Rae Photography · private page</footer>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LIVE = /(^|\.)mirandaraephotography\.com$/.test(location.hostname);
  var got = null;
  var q = new URLSearchParams(location.search);
  if (q.get('name')) $('name').value = q.get('name');
  if (q.get('num')) $('num').value = String(q.get('num')).replace(/\D/g, '');
  if (q.get('amount')) $('amount').value = String(q.get('amount')).replace(/[^0-9.]/g, '');
  var money = function(n){ return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  $('go').addEventListener('click', function(){
    if (!$('name').value.trim()) { $('name').reportValidity(); return; }
    if (!$('amount').checkValidity()) { $('amount').reportValidity(); return; }
    var btn = this; btn.disabled = true; $('err').hidden = true;
    var name = $('name').value.trim(), num = $('num').value.replace(/\D/g, ''), amt = Number($('amount').value) || 0, how = $('method').value;
    var day = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    var counted = got ? Promise.resolve(got) : fetch('/api/booking-counter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'deposit', amount: amt, ref: num }) })
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
    counted.then(function(c){
      if (c) got = c;
      var o = { _captcha: 'false', _template: 'table' };
      if (LIVE) o._cc = 'bookmirandarae@gmail.com';
      o['booking-number'] = num ? '#' + num : 'not filled in';
      o.name = name; o.amount = money(amt); o['paid-with'] = how; o.date = day;
      o['deposits-total'] = c ? money(c.deposits) + ' from ' + c.depositCount + ' deposits received (private)' : 'not available';
      o.page = 'Deposit Received page';
      o._subject = '✅ DEPOSIT RECEIVED: ' + [num ? '#' + num : '', name, money(amt)].filter(Boolean).join(' · ');
      return fetch('https://formsubmit.co/ajax/mirandaraep@gmail.com', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(o) })
        .then(function(r){
          if (!r.ok) throw new Error(r.status);
          $('sum').innerHTML = '<b>Client</b> ' + esc(name) + (num ? '<br><b>Booking</b> #' + esc(num) : '') + '<br><b>Amount</b> ' + esc(money(amt)) + '<br><b>Paid with</b> ' + esc(how) + '<br><b>Date</b> ' + esc(day);
          $('step1').hidden = true; $('step2').hidden = false; window.scrollTo(0, 0);
        });
    }).catch(function(){ btn.disabled = false; $('err').hidden = false; });
  });
})();
</script>
</body>
</html>
